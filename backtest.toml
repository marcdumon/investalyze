# MD> Backtest settings: costs and limits. Every key is optional; the defaults in
# src/investalyze/backtest/config.py apply to anything left out.

starting_cash = 1_000_000.0
benchmark = '^NDX'   # current to the last price date, unlike ^SPX (stale since 2026-07-02)
long_only = true     # the survivorship-biased panel makes a short book especially misleading
exclude_checks = ['ohlc_inconsistent', 'nonpositive_price']

[costs]
slippage_bps = 5.0
commission_bps = 2.0
min_commission = 1.0
impact_coef = 0.1
borrow_bps_annual = 50.0
cash_bps_annual = 0.0

[limits]
max_weight = 0.05
max_gross = 1.0
max_net = 1.0
max_position_adv = 0.25
participation = 0.05
max_order_age = 5
