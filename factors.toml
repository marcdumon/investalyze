# MD> Your own factors. The Screener page edits this file for you: open 'Your factors' at
# the top of it to add or delete one, with the formula checked as you type. Editing here by
# hand works too.
#
# Each factor then behaves like a built-in: a Screener column and rank, a column in the
# backtest factor panel, and a name a backtest signal can trade on.
#
# Two kinds:
#   expression  = arithmetic over factor columns already in the panel. Alongside every
#                 built-in factor `x` you may also use `rank_x`, its cross-sectional
#                 percentile from 0 to 100, already oriented so 100 is the good end.
#                 Ranking before combining is what puts different units on one scale.
#   numerator / denominator = a ratio straight from the financial statements.
#
# A new factor is live in the Screener at once. To give it values in backtests, press
# '1. Build factor panel' on the Backtest page.

[factors.quality_blend]
expression = '0.5 * rank_roe + 0.5 * rank_roa'
higher_is_better = true
description = 'Equal blend of the return-on-equity and return-on-assets ranks.'

[factors.cheap_quality]
expression = '(rank_fcf_yield + rank_roe + rank_op_margin) / 3'
higher_is_better = true
description = 'A name has to be cheap on free cash flow and profitable, not just one of the two.'

[factors.risk_adjusted_momentum]
expression = 'ret_12_1 / vol_252'
higher_is_better = true
description = 'Twelve-month momentum per unit of realized volatility.'

# Ratio factors read the statements directly. The statement is inferred from the column
# name; income and cashflow terms are summed over the trailing four quarters, balance terms
# take the latest published quarter. A denominator of zero or less yields NaN.
#
# SimFin stores expenses as negative numbers, so prefix a term with '-' to read its
# magnitude: '-Research & Development' gives spend as a positive figure.

[factors.asset_turnover]
numerator = 'Revenue'
denominator = 'Total Assets'
higher_is_better = true
description = 'Trailing revenue per dollar of assets.'

[factors.rd_intensity]
numerator = '-Research & Development'
denominator = 'Revenue'
higher_is_better = true
description = 'Research spend as a share of revenue.'
